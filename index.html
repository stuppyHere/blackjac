<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Blackjack</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/style.css" >
    <link rel="icon" href="src/pics/logo.png" >
  </head>

  <body>
    <div class="bal" id="bal">
      Balance: $<span id="ball"></span>
      <a href="pay.html" class="add">✚</a>
    </div>

    <main class="gamecontainer" id="gamecontainer">
      <h1 class="logo">Blackjack</h1>

      <div class="cardContainer" id="cardContainer">
        <div class="hand">
          <h3>Dealer</h3>

          <div class="cards dealerCards" id="dealerCards">
            <!-- cards later -->
          </div>
        </div>

        <div class="hand">
          <h3>You</h3>

          <div class="cards myCards" id="myCards">
            <!-- cards later -->
          </div>
        </div>
      </div>

      <p class="message" id="message">Wanna play a round?</p>

      <p class="sum" id="sum">Sum:</p>

      <div class="buttons">
        <button id="start">Start</button>
        <button id="pull">Pull</button>
        <button id="nop">Nope</button>
        <button id="re">Restart</button>
        <button id="home">Home</button>
        <a href="pay.html">
          <button id="add-bal">Add Balance</button>
        </a>
      </div>
    </main>

    <script src="src/js/app.js"></script>
  </body>
</html>
