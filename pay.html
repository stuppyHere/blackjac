<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Payment</title>
    <link rel="icon" href="src/pics/logo.png" />
    <link rel="stylesheet" href="src/css/pay.css" />
  </head>
  <body>
    <div class="modal">
      <h2>Add Balance</h2>
      <p class="sub">Top up your chips to keep playing</p>

      <div class="amount-options">
        <button class="top-up" id="500">$500</button>
        <button class="top-up" id="1000">$1,000</button>
        <button class="top-up" id="1500">$1,500</button>
      </div>

      <label for="card">Card Number</label>
      <input required type="text" id="card" placeholder="1234 5678 9012 3456" />

      <div class="row">
        <div>
          <label for="exp">Expiry</label>
          <input required type="text" id="exp" placeholder="MM/YY" />
        </div>
        <div>
          <label for="cvv">CVV</label>
          <input required type="text" id="cvv" placeholder="123" />
        </div>
      </div>

      <label for="name">Name on Card</label>
      <input required type="text" id="name" placeholder="John Doe" />

      <a href="index.html"><button onclick="#" class="pay-btn" id="pay-btn">Pay Now</button></a
      >
    </div>
    <script src="src/js/pay.js"></script>
  </body>
</html>
